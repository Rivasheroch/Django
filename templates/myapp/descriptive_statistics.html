<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Descriptive Statistics</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <style>
        body {
            background-color: #f8f9fa;
            padding: 20px;
        }
        h2 {
            margin-bottom: 20px;
        }
        .btn-custom {
            margin-right: 10px;
        }
        .table-responsive {
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2 class="text-center">Descriptive Statistics</h2>

        <div class="text-right mb-3">
            <a href="{% url 'dashboard' %}" class="btn btn-primary btn-custom">Back to Dashboard</a>
            <a href="{% url 'logout' %}" class="btn btn-danger btn-custom">Logout</a>
        </div>

        {% if stats %}
            <div class="table-responsive">
                {{ stats|safe }}  <!-- Render the HTML table -->
            </div>
        {% elif error %}
            <div class="alert alert-danger">
                {{ error }}
            </div>
        {% else %}
            <div class="alert alert-info">
                No statistics to display.
            </div>
        {% endif %}
    </div>

    <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.6/dist/umd/popper.min.js"></script>
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>
</body>
</html>
