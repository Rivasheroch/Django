<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Home</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <style>
        body {
            background-color: #f8f9fa;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        h1 {
            margin-bottom: 30px;
        }
        .form-container {
            background: white;
            padding: 20px;
            border-radius: 5px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 400px;
        }
        .btn-custom {
            width: 100%;
        }
        .message {
            margin-top: 20px;
        }
        .form-row {
            display: flex;
            justify-content: space-between;
            width: 100%;
        }
        .form-column {
            flex: 1;
            margin: 0 10px; /* Adds space between columns */
        }
    </style>
</head>
<body>
    <h1 class="text-center">Welcome to the Energy Consumption Prediction App</h1>

    <div class="form-row">
        <div class="form-column">
            <div class="form-container">
                <h2>Signup</h2>
                <form method="post">
                    {% csrf_token %}
                    {{ signup_form.as_p }}  <!-- Corrected this line -->
                    <button type="submit" name="signup" class="btn btn-primary btn-custom">Sign Up</button>
                </form>
            </div>
        </div>

        <div class="form-column">
            <div class="form-container">
                <h2>Login</h2>
                <form method="post">
                    {% csrf_token %}
                    <div class="form-group">
                        <input type="text" name="username" class="form-control" placeholder="Username" required>
                    </div>
                    <div class="form-group">
                        <input type="password" name="password" class="form-control" placeholder="Password" required>
                    </div>
                    <button type="submit" name="login" class="btn btn-primary btn-custom">Log In</button>
                </form>
            </div>
        </div>
    </div>

    {% if messages %}  <!-- Corrected this line -->
        {% for message in messages %}
            <div class="alert alert-info message">{{ message }}</div>
        {% endfor %}
    {% endif %}

    <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.6/dist/umd/popper.min.js"></script>
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>
</body>
</html>
